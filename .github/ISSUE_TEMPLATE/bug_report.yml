name: Bug report
description: Something in Nirvana doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /light in a project with ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error message or output
      description: Paste it as text. It is formatted as code automatically.
      render: text
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows (PowerShell 5.1)
        - Windows (PowerShell 7)
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nirvana version
      description: Contents of ~/.claude/nirvana-templates/.nirvana-version
      placeholder: "2.2.0"
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
